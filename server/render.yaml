services:
  - type: web
    name: crossproduct-server
    env: node
    runtime: node
    buildCommand: |
      echo "Installing dependencies..."
      npm ci
      echo "Building application..."
      npm run build
      echo "Build completed successfully"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: PORT
        value: 10000
